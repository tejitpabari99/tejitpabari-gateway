name: usage-ping CI

on:
  push:
    paths:
      - 'workers/usage-ping/**'
      - '.github/workflows/usage-ping-ci.yml'
  pull_request:
    paths:
      - 'workers/usage-ping/**'
      - '.github/workflows/usage-ping-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/usage-ping
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/usage-ping/package-lock.json
      - run: npm ci
      - run: npm test
